name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 【本次修复】探测并挑选一个"活着"的检测 Worker。
      # 原因: 原来写死的 check.helei.kdns.fr 已经解析不到(NXDOMAIN),
      #       所有节点检测全部报错 -> 脚本 exit 1 -> GitHub 每次都发失败邮件。
      # 现在: 逐个探测, 谁先返回 200 就用谁; 某个域名挂了会自动切到下一个,
      #       全部挂掉才回退到默认地址(此时失败是真实故障, 该报警)。
      # 以后要加自己的 Worker, 直接往 CANDIDATES 里追加(空格分隔)即可。
      - name: Pick a live check Worker
        id: pick
        run: |
          FIRST="https://gz.guozhijun.kdns.fr/check?sstp=vpn:vpn@"
          CANDIDATES="$FIRST https://check.helei.kdns.fr/check?sstp=vpn:vpn@"
          for u in $CANDIDATES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${u}vpn1.opengw.net%3A443" || true)
            echo "探测 $u -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "worker=$u" >> "$GITHUB_OUTPUT"
              echo "已选用检测 Worker: $u"
              exit 0
            fi
          done
          echo "worker=$FIRST" >> "$GITHUB_OUTPUT"
          echo "::warning::所有候选检测 Worker 均不可用, 已回退到默认地址, 本轮大概率失败"

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 由上一步自动挑选出来的可用 Worker
          CHECK_WORKER: "${{ steps.pick.outputs.worker }}"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 官方 API / GitHub 镜像在高峰期响应可能超过 60s, 放宽到 120s 避免误判失败
          HTTP_TIMEOUT: "120"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://zhijunguo588-boop.github.io/xhafx/ (deploy outcome: ${{ steps.deployment.outcome }})"'
